<!DOCTYPE html>
<html>
<head><title>GIF Test</title></head>
<body style="background:#111;color:#fff;font-family:sans-serif;padding:20px;">
<h2>Exercise GIF Test</h2>
<div id="results"></div>
<script>
const tests = [
  {name:"ExerciseDB CDN", url:"https://v2.exercisedb.io/image/3xUBLhqFXFhSst"},
  {name:"Fitnessprogramer", url:"https://fitnessprogramer.com/wp-content/uploads/2021/02/Barbell-Bench-Press.gif"},
  {name:"WorkoutLabs", url:"https://workoutlabs.com/wp-content/uploads/cache/wl-exercises/Bench_Press.gif"},
  {name:"Giphy", url:"https://media.giphy.com/media/3o7TKP0mFKqlOmCECY/giphy.gif"},
  {name:"RapidAPI ExerciseDB", url:"https://exercisedb.p.rapidapi.com/exercises/name/bench%20press?limit=1", isAPI:true},
];

const div = document.getElementById('results');

tests.forEach(t => {
  if (t.isAPI) {
    fetch(t.url, {
      headers: {
        'X-RapidAPI-Key': '80e84f5981mshbdcd5e90dbf1bcdp1a8fa4jsn4f9b25df7b95',
        'X-RapidAPI-Host': 'exercisedb.p.rapidapi.com'
      }
    }).then(r => r.json()).then(d => {
      div.innerHTML += `<p style="color:lime">✅ ${t.name}: ${d[0]?.name} - ${d[0]?.gifUrl}</p>`;
    }).catch(e => {
      div.innerHTML += `<p style="color:red">❌ ${t.name}: ${e.message}</p>`;
    });
  } else {
    const img = new Image();
    img.onload = () => div.innerHTML += `<div><p style="color:lime">✅ ${t.name}</p><img src="${t.url}" style="height:80px"/></div>`;
    img.onerror = () => div.innerHTML += `<p style="color:red">❌ ${t.name}: blocked</p>`;
    img.src = t.url;
  }
});
</script>
</body>
</html>
